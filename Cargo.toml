[package]
name = "drop-in-badminton"
version = "0.2.2"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
eframe = "0.37"
egui = "0.37"
rusqlite = { version = "0.41.1", features = ["bundled"] }
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"

[profile.release]
# Smaller download for the self-updater.
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
# Puts the app icon into the .exe (Explorer, desktop shortcuts, taskbar).
winresource = "0.1"
