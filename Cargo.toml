[package]
name = "drop-in-badminton"
version = "0.3.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
eframe = "0.37"
egui = "0.37"
getrandom = "0.3"
rfd = "0.18.0"
rusqlite = { version = "0.41.1", features = ["bundled", "serialize"] }
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"

# Unlocking stretches the password on purpose; unoptimised that takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# Smaller download for the self-updater.
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
# Puts the app icon into the .exe (Explorer, desktop shortcuts, taskbar).
winresource = "0.1"
