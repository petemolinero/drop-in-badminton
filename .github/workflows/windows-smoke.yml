# Starts the Windows build on a clean Windows machine and checks it stays open:
# the released .exe has no console, so a start-up crash is otherwise silent.
name: Windows smoke test

on:
  workflow_dispatch:
  push:
    branches: ["smoke/**"]

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Released .exe (latest release)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/petemolinero/drop-in-badminton/releases/latest/download/drop-in-badminton-windows-x86_64.exe -OutFile released.exe
          ./tools/smoke.ps1 -Exe released.exe -Name released

      - name: This build
        shell: pwsh
        run: ./tools/smoke.ps1 -Exe target/release/drop-in-badminton.exe -Name built

      - name: This build, with the first graphics setup crashing like a broken driver
        shell: pwsh
        run: |
          $env:DROP_IN_BADMINTON_FAKE_CRASH = 'dx12'
          ./tools/smoke.ps1 -Exe target/release/drop-in-badminton.exe -Name fake-crash -Expect warp
          if ($LASTEXITCODE) { exit 1 }
          # Proof Direct3D 12 died before choosing an adapter, rather than failing cleanly.
          $log = Join-Path $env:APPDATA 'drop-in-badminton\drop-in-badminton\data\crash.log'
          if (Select-String -Path $log -Pattern 'no dx12' -Quiet -ErrorAction SilentlyContinue) { 'FAILED: dx12 was not crashed'; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke-*
